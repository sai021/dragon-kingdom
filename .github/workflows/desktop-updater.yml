name: Desktop updater
on:
  push:
    paths: ['desktop-updater/**', '.github/workflows/desktop-updater.yml']
  pull_request:
    paths: ['desktop-updater/**', '.github/workflows/desktop-updater.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 15
    env:
      # Intel Mac has no current crypto wheel. Its source build must not
      # collide with Python's differently-versioned libssl in the app bundle.
      OPENSSL_STATIC: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-updater
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s ../dragon-firmware/tests -p test_fresh_install.py -v
      - run: python main.py --self-test
      - run: python package.py
      - uses: actions/upload-artifact@v4
        with:
          name: updater-${{ matrix.os }}
          path: desktop-updater/.tools/package/Dragon-Kingdom-Updater-*.zip
          if-no-files-found: error
